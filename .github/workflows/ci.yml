name: CI/CD Test & Verification Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    name: Typecheck & Pure State Machine Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Typecheck TypeScript Codebase
        run: npx tsc --noEmit

      - name: Run Level 1 State Machine Unit Tests
        run: npm run test:level1

